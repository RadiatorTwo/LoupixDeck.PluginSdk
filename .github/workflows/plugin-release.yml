name: Plugin Store Release

# Reusable workflow for LoupixDeck plugin repositories (issue #234 in RadiatorTwo/LoupixDeck).
# It builds the plugin against this SDK, packs it in the Plugin Store format and attaches the
# files to the GitHub release that triggered the caller:
#
#   <id>-<version>-<platform>.zip   plugin.json and the plugin files at the zip root
#   plugin.json                     the manifest, so the store can read it without the zip
#   SHA256SUMS                      sha256sum output for the files above
#
# It also prints the plugin's plugin-store.json entry to the job summary and puts it in the build
# artifact as store-entry.json, ready to be pasted into a pull request against the LoupixDeck
# repository. The store reads the published version from that file, so a release only reaches users
# once its entry is merged.
#
# <platform> follows plugin.json: "Windows" -> windows, "Linux" -> linux, "macOS" -> macos,
# "All" (or none) -> any. An optional "architectures" list in plugin.json (x64, arm64) is copied to
# the package entry, so the store only offers the package on those CPU architectures.
#
# A plugin with native code per CPU architecture sets the runtimes input instead (e.g.
# 'win-x64 win-arm64'). The plugin is then built once per runtime identifier and one package per
# runtime is attached:
#
#   win-x64    <id>-<version>-windows.zip        platform windows, architectures [x64]
#   win-arm64  <id>-<version>-windows-arm64.zip  platform windows-arm64
#
# (linux-* and osx-* likewise). The x64 build keeps the plain platform name, so LoupixDeck versions
# that predate architectures go on installing it; newer ones take the arm64 package on ARM64.
#
# Caller (.github/workflows/release.yml in the plugin repository):
#
#   on:
#     release:
#       types: [published]
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: RadiatorTwo/LoupixDeck.PluginSdk/.github/workflows/plugin-release.yml@master
#       with:
#         build-sdk: false      # the plugin references an SDK version published on nuget.org
#         runtimes: ''          # optional, e.g. 'win-x64 win-arm64' for per-architecture packages
#
# A manual run (workflow_dispatch) only builds the files as an artifact.

on:
  workflow_call:
    inputs:
      project:
        description: 'Plugin project, relative to the repository root. Default: <repository name>.csproj'
        required: false
        type: string
        default: ''
      dotnet-version:
        description: '.NET SDK used for the build'
        required: false
        type: string
        default: '10.0.x'
      build-sdk:
        description: >-
          Build LoupixDeck.PluginSdk from source and serve it from a local folder feed.
          Set to false once the plugin references a version published on nuget.org.
        required: false
        type: boolean
        default: true
      runtimes:
        description: >-
          Optional runtime identifiers, separated by spaces or commas (e.g. 'win-x64 win-arm64'). Each
          one is built and packed on its own, for plugins with native code per CPU architecture. Empty
          builds one package for the platform in plugin.json, as before.
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Build and package
    runs-on: ubuntu-latest

    steps:
      # Plugin and SDK side by side, the layout every plugin's nuget.config expects.
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: src/${{ github.event.repository.name }}

      # Only for plugins pinned to an SDK version that predates the nuget.org listing; those
      # versions exist nowhere but this repository's build output.
      - name: Checkout Plugin SDK
        if: inputs.build-sdk
        uses: actions/checkout@v5
        with:
          repository: RadiatorTwo/LoupixDeck.PluginSdk
          path: src/LoupixDeck.PluginSdk

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Build Plugin SDK package
        if: inputs.build-sdk
        run: dotnet build src/LoupixDeck.PluginSdk -c Release

      # Plugin nuget.config files reference the SDK feed either as ..\LoupixDeck.PluginSdk\nupkg or
      # as ..\LoupixDeck\LoupixDeck.PluginSdk\nupkg. A missing local source is a hard error, so the
      # feed is mirrored to the nested path too.
      - name: Mirror SDK feed for nested-path plugins
        if: inputs.build-sdk
        run: |
          mkdir -p src/LoupixDeck/LoupixDeck.PluginSdk
          cp -r src/LoupixDeck.PluginSdk/nupkg src/LoupixDeck/LoupixDeck.PluginSdk/nupkg

      - name: Read and check plugin.json
        id: manifest
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          manifest="src/$REPO_NAME/plugin.json"
          id=$(jq -r '.id // empty' "$manifest")
          version=$(jq -r '.version // empty' "$manifest")
          sdk=$(jq -r '.sdkVersion // empty' "$manifest")
          entry=$(jq -r '.entryAssembly // empty' "$manifest")
          platform=$(jq -r '.platform // "All"' "$manifest")
          architectures=$(jq -c '.architectures // []' "$manifest")

          for field in id version sdk entry; do
            if [ -z "${!field}" ]; then
              echo "plugin.json is missing '$field'." >&2
              exit 1
            fi
          done

          # The store only compares plain major.minor.patch versions.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "plugin.json version '$version' is not major.minor.patch." >&2
            exit 1
          fi

          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag '$RELEASE_TAG' does not match plugin.json version 'v$version'." >&2
            exit 1
          fi

          case "${platform,,}" in
            windows) suffix=windows ;;
            linux) suffix=linux ;;
            macos) suffix=macos ;;
            all|"") suffix=any ;;
            *) echo "Unknown platform '$platform' in plugin.json." >&2; exit 1 ;;
          esac

          if ! jq -e 'type == "array" and all(.[]; . == "x64" or . == "arm64")' <<<"$architectures" > /dev/null; then
            echo "plugin.json architectures $architectures may only list x64 and arm64." >&2
            exit 1
          fi

          {
            echo "id=$id"
            echo "version=$version"
            echo "sdk=$sdk"
            echo "entry=$entry"
            echo "platform=$suffix"
            echo "architectures=$architectures"
          } >> "$GITHUB_OUTPUT"

      # One line per package: "<runtime identifier or -> <package platform> <architectures JSON or ->".
      # Without runtimes that is the single package for plugin.json's platform, built as before.
      - name: Plan the packages
        env:
          RUNTIMES: ${{ inputs.runtimes }}
          PLATFORM: ${{ steps.manifest.outputs.platform }}
          ARCHITECTURES: ${{ steps.manifest.outputs.architectures }}
        run: |
          set -euo pipefail
          : > packages.txt
          if [ -z "${RUNTIMES//[ ,]/}" ]; then
            if [ "$ARCHITECTURES" = "[]" ]; then
              echo "- $PLATFORM -" >> packages.txt
            else
              echo "- $PLATFORM $ARCHITECTURES" >> packages.txt
            fi
          else
            for rid in ${RUNTIMES//,/ }; do
              case "$rid" in
                win-*) os=windows ;;
                linux-*) os=linux ;;
                osx-*) os=macos ;;
                *) echo "Runtime '$rid' is not a win-, linux- or osx- runtime identifier." >&2; exit 1 ;;
              esac
              arch="${rid#*-}"
              if [ "$arch" != x64 ] && [ "$arch" != arm64 ]; then
                echo "Runtime '$rid': only x64 and arm64 are supported." >&2
                exit 1
              fi
              if [ "$PLATFORM" != any ] && [ "$PLATFORM" != "$os" ]; then
                echo "Runtime '$rid' does not match the platform '$PLATFORM' in plugin.json." >&2
                exit 1
              fi
              if ! jq -e --arg a "$arch" 'length == 0 or index($a) != null' <<<"$ARCHITECTURES" > /dev/null; then
                echo "Runtime '$rid' is not in the plugin.json architectures $ARCHITECTURES." >&2
                exit 1
              fi
              # x64 keeps the plain platform name: older LoupixDeck versions only install that one.
              if [ "$arch" = x64 ]; then
                echo "$rid $os [\"x64\"]" >> packages.txt
              else
                echo "$rid $os-$arch [\"$arch\"]" >> packages.txt
              fi
            done
            dupes=$(cut -d' ' -f2 packages.txt | sort | uniq -d)
            if [ -n "$dupes" ]; then
              echo "Two runtimes produce the same package: $dupes" >&2
              exit 1
            fi
          fi
          cat packages.txt

      # Same selection the app release used when it still bundled plugins: everything the build
      # produced except symbols and runtimeconfig files. The SDK itself is never copied (the plugin
      # references it with ExcludeAssets=runtime); the host provides it. A per-runtime build is not
      # self-contained (the host brings the runtime), and its packed plugin.json names its
      # architecture, so LoupixDeck refuses it on another one.
      - name: Build and package
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT: ${{ inputs.project }}
          PLUGIN_ID: ${{ steps.manifest.outputs.id }}
          PLUGIN_VERSION: ${{ steps.manifest.outputs.version }}
          PLUGIN_ENTRY: ${{ steps.manifest.outputs.entry }}
        run: |
          set -euo pipefail
          project="${PROJECT:-$REPO_NAME.csproj}"
          mkdir -p dist
          while read -r rid platform architectures; do
            package="$PLUGIN_ID-$PLUGIN_VERSION-$platform.zip"
            if [ "$rid" = - ]; then
              build=build
              staging=staging
              dotnet build "src/$REPO_NAME/$project" -c Release -o "$build" /p:DebugSymbols=false /p:DebugType=none
            else
              build="build-$rid"
              staging="staging-$rid"
              dotnet build "src/$REPO_NAME/$project" -c Release -r "$rid" --self-contained false -o "$build" /p:DebugSymbols=false /p:DebugType=none
            fi

            mkdir -p "$staging"
            find "$build" -mindepth 1 -maxdepth 1 ! -name '*.pdb' ! -name '*.runtimeconfig.json' -exec cp -r {} "$staging/" \;
            rm -f "$staging/LoupixDeck.PluginSdk.dll"
            if [ "$rid" = - ]; then
              cp "src/$REPO_NAME/plugin.json" "$staging/plugin.json"
            else
              jq --argjson a "$architectures" '.architectures = $a' "src/$REPO_NAME/plugin.json" > "$staging/plugin.json"
            fi

            if [ ! -f "$staging/$PLUGIN_ENTRY" ]; then
              echo "Entry assembly '$PLUGIN_ENTRY' is missing from the build output." >&2
              exit 1
            fi

            (cd "$staging" && zip -r -X "../dist/$package" .)
          done < packages.txt

          cp "src/$REPO_NAME/plugin.json" dist/plugin.json
          (cd dist && sha256sum $(cut -d' ' -f2 ../packages.txt | sed "s/.*/$PLUGIN_ID-$PLUGIN_VERSION-&.zip/") plugin.json > SHA256SUMS)
          cat dist/SHA256SUMS

      # The Plugin Store installs from plugin-store.json in the LoupixDeck repository, which carries the
      # published version of every plugin. That entry is written here, ready to paste: the maintainer copies
      # it from the job summary (or from store-entry.json in the build artifact) into a pull request. No token
      # and no write access to the LoupixDeck repository are involved.
      - name: Emit the plugin store entry
        env:
          ID: ${{ steps.manifest.outputs.id }}
          VERSION: ${{ steps.manifest.outputs.version }}
          SDK: ${{ steps.manifest.outputs.sdk }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-v$VERSION}"
          published="${PUBLISHED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"

          # An architecture-specific platform (windows-arm64) already names its architecture.
          packages='[]'
          while read -r rid platform architectures; do
            file="$ID-$VERSION-$platform.zip"
            sha=$(awk -v file="$file" '$2 == file || $2 == "*"file { print $1 }' dist/SHA256SUMS)
            packages=$(jq -c \
              --arg platform "$platform" \
              --arg architectures "$architectures" \
              --arg file "$file" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$file" \
              --arg sha "$sha" \
              '. + [ { platform: $platform }
                     + (if $architectures == "-" or ($platform | contains("-")) then {}
                        else { architectures: ($architectures | fromjson) } end)
                     + { fileName: $file, downloadUrl: $url, sha256: $sha } ]' <<<"$packages")
          done < packages.txt

          jq -n \
            --arg version "$VERSION" \
            --arg tag "$tag" \
            --arg published "$published" \
            --arg sdk "$SDK" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            --argjson packages "$packages" \
            '{
               version: $version,
               tag: $tag,
               publishedAt: $published,
               sdkVersion: $sdk,
               releaseNotesUrl: $notes,
               packages: $packages
             }' > store-entry.json

          {
            echo "## Plugin Store entry"
            echo
            echo "Paste this as the \`release\` of the **$ID** entry in"
            echo "[plugin-store.json](https://github.com/RadiatorTwo/LoupixDeck/blob/master/plugin-store.json)"
            echo "and open a pull request. The pull request is validated automatically."
            echo
            if [ "$GITHUB_EVENT_NAME" != "release" ]; then
              echo "> This run is not a release: the tag and the download URL are what they *will* be once"
              echo "> \`$tag\` is published."
              echo
            fi
            echo '```json'
            cat store-entry.json
            echo '```'
            echo
            echo "A plugin that ships a package per OS (windows, linux, macos) without the runtimes input"
            echo "publishes one per run; merge them into the same \`packages\` array."
          } >> "$GITHUB_STEP_SUMMARY"

      # store-entry.json travels in the artifact, not in dist: only the files in dist are attached to
      # the release.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.manifest.outputs.id }}-${{ steps.manifest.outputs.version }}
          path: |
            dist
            store-entry.json

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
